<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="치료 통역" />
    <title>치료 통역</title>
    <meta
      name="description"
      content="한국어로 말하면 일본어·영어·아랍어 환자와 바로 소통하는 물리치료 통역. 큰 글씨와 한글 발음."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app" class="app">
      <header class="top">
        <div class="titles">
          <h1>치료 통역 <span class="app-version">v3.6</span></h1>
          <p id="status" class="status">준비 중</p>
        </div>
        <div class="top-actions">
          <button id="open-settings" type="button" class="text-btn">설정</button>
          <button id="clear" type="button" class="text-btn">기록 지우기</button>
        </div>
      </header>
      <button id="update" type="button" class="update" hidden></button>
      <dialog id="settings" class="settings">
        <h2>환자 언어</h2>
        <div id="lang-choice" class="lang-choice" role="radiogroup" aria-label="환자 언어"></div>
        <h2>목소리</h2>
        <div class="voice-choice">
          <label><input type="radio" name="voice-gender" value="female" checked /> 여자</label>
          <label><input type="radio" name="voice-gender" value="male" /> 남자</label>
        </div>
        <label class="voice-row">음성
          <select id="voice-select"><option value="">폰 기본 목소리 (자동)</option></select>
        </label>
        <label class="voice-row">말하기 속도 <span id="voice-rate-value">1.00배</span>
          <input id="voice-rate" type="range" min="0.5" max="1.5" step="0.05" value="1" />
        </label>
        <button id="test-voice" type="button" class="voice-test">🔊 들어보기</button>
        <p id="voice-note" class="engine-state"></p>
        <h2>기록</h2>
        <label class="keep-row"><input id="keep-cards" type="checkbox" /> 오늘 카드 남기기</label>
        <p class="engine-state">새로고침해도 오늘 카드가 남습니다. 환자와 나눈 말이 이 폰에 저장되고, 다음 날 앱을 열 때 지워집니다. 끄거나 ‘기록 지우기’를 누르면 바로 지워집니다.</p>
        <h2>번역 설정</h2>
        <p>Gemini 키를 넣으면 치료 상황에 맞춘 더 자연스러운 번역을 씁니다. 키는 이 폰에만 저장돼요.</p>
        <p><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Gemini 키 무료로 받기</a></p>
        <input id="gemini-key" type="password" autocomplete="off" placeholder="Gemini API 키 붙여넣기" />
        <p id="engine-state" class="engine-state"></p>
        <div class="settings-actions">
          <button id="save-key" type="button">저장하고 확인</button>
          <button id="remove-key" type="button" class="text-btn">키 지우기</button>
          <button id="close-settings" type="button" class="text-btn">닫기</button>
        </div>
      </dialog>
      <dialog id="phrase-editor" class="phrase-editor" aria-labelledby="phrase-editor-title">
        <div class="pe-head">
          <h2 id="phrase-editor-title">자주 쓰는 말 편집</h2>
          <button id="phrase-close" type="button" class="pe-close">닫기</button>
        </div>
        <form id="phrase-form" class="manual">
          <label class="sr" for="phrase-input">새 문구</label>
          <input id="phrase-input" maxlength="60" autocomplete="off" placeholder="새 문구를 한국어로" enterkeyhint="done" />
          <button type="submit">추가</button>
        </form>
        <p class="pe-help">★를 누르면 맨 위에 나옵니다. 내가 추가한 문구는 누를 때마다 번역하므로 ‘번역된 뜻’을 확인해 주세요. 이 폰에만 저장돼요.</p>
        <p id="phrase-note" class="pe-note" role="status"></p>
        <ul id="phrase-list" class="pe-list"></ul>
        <button id="phrase-reset" type="button" class="pe-reset" hidden></button>
      </dialog>
      <dialog id="answers" class="answers" aria-label="환자 대답"></dialog>
      <p id="banner" class="banner" hidden></p>
      <div id="log" class="log" role="log" aria-relevant="additions"></div>
      <p id="interim" class="interim" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="interim-lang" class="interim-lang" hidden></span>
        <span id="interim-text"></span>
      </p>
      <div class="dock">
        <section class="phrases-panel" aria-labelledby="phrases-title">
          <div class="panel-head">
            <h2 id="phrases-title" class="panel-title"><button id="toggle-phrases" type="button" aria-expanded="false" aria-controls="presets">자주 쓰는 말 <small>펼치기 ▲</small></button></h2>
            <button id="edit-phrases" type="button" class="panel-btn" aria-label="자주 쓰는 말 편집">편집</button>
            <button id="open-answers" type="button" class="panel-btn is-answer">환자 대답</button>
          </div>
          <div id="phrase-nav" class="phrase-nav" aria-label="묶음으로 가기"></div>
          <div id="presets" class="presets" aria-label="자주 쓰는 말"></div>
        </section>
        <div class="controls">
        <form id="manual" class="manual">
          <label class="sr" for="manual-input">한국어 문장</label>
          <input
            id="manual-input"
            enterkeyhint="send"
            autocomplete="off"
            autocapitalize="off"
            placeholder="한국어로 입력"
          />
          <button type="submit">번역</button>
        </form>
        <div class="dock-row">
          <label class="auto" id="auto-label">
            <input id="auto-speak" type="checkbox" />
            <span>자동 읽어주기</span>
          </label>
          <div id="mode" class="mode-toggle" role="radiogroup" aria-label="통역 방향">
            <button type="button" role="radio" data-mode="one" aria-checked="true">단방향</button>
            <button type="button" role="radio" data-mode="two" aria-checked="false">양방향</button>
            <button type="button" role="radio" data-mode="auto" aria-checked="false">동시통역</button>
          </div>
        </div>
        <p id="hint" class="hint"></p>
        <button id="mic" type="button" class="mic" aria-pressed="false">
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3.2a3.2 3.2 0 0 1 3.2 3.2v5.2a3.2 3.2 0 1 1-6.4 0V6.4A3.2 3.2 0 0 1 12 3.2z"
              fill="currentColor"
            />
            <path
              d="M6.2 11.2a5.8 5.8 0 0 0 11.6 0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path d="M12 17v3.2M9.2 20.2h5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span id="mic-label">음성 입력 시작</span>
        </button>
        <div id="mic-pair" class="mic-pair" hidden>
          <button id="mic-ko" type="button" class="mic mic-side mic-ko" aria-pressed="false">
            <span class="mic-flag" aria-hidden="true">🇰🇷</span>
            <span class="mic-side-label" id="mic-ko-label">내가 말하기</span>
          </button>
          <button id="mic-patient" type="button" class="mic mic-side mic-patient" aria-pressed="false" lang="ja">
            <span class="mic-flag" id="mic-patient-flag" aria-hidden="true">🇯🇵</span>
            <span class="mic-side-label" id="mic-patient-label">患者さん 話す<small>(환자)</small></span>
          </button>
        </div>
        </div>
      </div>
    </div>
    <video id="nosleep" playsinline muted loop preload="auto" src="%BASE_URL%silence.mp4" aria-hidden="true"></video>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
